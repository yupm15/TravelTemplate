<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Osaka 2026｜Notion 行程與地圖（Map Card 重新設計版）</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">

<style>
:root{
  --bg:#f7f7f5;--paper:#fff;--ink:#37352f;--muted:#787774;
  --line:#e8e7e4;--soft:#f1f1ef;--accent:#d45d3c;--green:#448361;
  --warning:#fff4ce;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}
button,a{font:inherit}
.topbar{
  min-height:54px;background:#fff;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));
  position:sticky;top:0;z-index:1000
}
.brand{font-weight:700}.top-meta{font-size:.86rem;color:var(--muted);text-align:right}
.app{max-width:1440px;margin:auto;display:grid;grid-template-columns:minmax(460px,.95fr) minmax(500px,1.05fr)}
.notes-pane{padding:34px 42px 70px;border-right:1px solid var(--line);background:var(--paper)}
.map-pane{padding:18px;position:sticky;top:54px;height:calc(100vh - 54px)}
.cover{height:112px;border-radius:8px;background:linear-gradient(135deg,#e8ddd0,#d6e1dc);
margin-bottom:28px;display:flex;align-items:flex-end;padding:18px;font-size:2rem}
.eyebrow{font-size:.78rem;color:var(--muted);letter-spacing:.08em}
.page-title{font-size:2.5rem;line-height:1.15;margin:7px 0 10px}
.subtitle{color:var(--muted);margin:0 0 22px}
.properties{display:grid;grid-template-columns:110px 1fr;gap:8px 14px;
font-size:.92rem;padding:14px 0 20px;border-bottom:1px solid var(--line)}
.prop-name{color:var(--muted)}
.day-tabs{display:flex;gap:7px;overflow-x:auto;padding:22px 0 16px;-webkit-overflow-scrolling:touch}
.day-tabs button,.view-buttons button{
  border:1px solid var(--line);background:#fff;border-radius:7px;padding:8px 11px;
  cursor:pointer;white-space:nowrap;min-height:40px
}
.day-tabs button.active,.view-buttons button.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.day-header{margin:4px 0 18px}.day-header h2{margin:0 0 5px;font-size:1.45rem}
.day-header p{margin:0;color:var(--muted)}
.timeline{position:relative}
.timeline:before{content:"";position:absolute;left:76px;top:20px;bottom:20px;width:1px;background:var(--line);z-index:0}
.stop{display:grid;grid-template-columns:62px minmax(0,1fr);gap:28px;position:relative;margin-bottom:7px}
.dot{width:11px;height:11px;border-radius:50%;background:#fff;border:2px solid #aaa;position:absolute;left:71px;top:22px;z-index:2}
.stop.active .dot{background:var(--accent);border-color:var(--accent)}
.time{font-size:.78rem;color:var(--muted);padding-top:18px;text-align:right;white-space:nowrap;position:relative;z-index:1;background:var(--paper)}
.block{border-radius:7px;padding:13px 14px;cursor:pointer;border:1px solid transparent}
.stop.active .block{background:#fff8f5;border-color:#f0c8bc}
.block h3{font-size:1rem;margin:0 0 4px}.block p{margin:0;color:var(--muted);font-size:.9rem}
.route-chip{display:inline-flex;margin-top:8px;border-radius:4px;background:var(--soft);padding:4px 7px;font-size:.78rem}
.callout{margin-top:22px;background:var(--soft);border-radius:7px;padding:14px 16px;font-size:.9rem}
.callout ul{margin:8px 0 0;padding-left:20px}

.map-card{
  height:100%;background:#fff;border:1px solid var(--line);border-radius:10px;
  overflow:hidden;display:flex;flex-direction:column
}
.map-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.view-buttons{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.view-state{font-size:.78rem;color:var(--muted)}
/* 資訊與按鈕移至地圖上方 */
.map-info-top{border-bottom:1px solid var(--line);background:#fff}
.segment{padding:12px 14px 8px}
.segment strong{display:block;margin-bottom:4px}
.segment span{color:var(--muted);font-size:.9rem}
.actions{display:flex;gap:8px;flex-wrap:wrap;padding:0 14px 13px}
.actions a{
  border:1px solid var(--line);border-radius:7px;padding:10px 12px;color:var(--ink);
  text-decoration:none;font-size:.9rem;min-height:42px;display:inline-flex;align-items:center
}
.actions a.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
#map{flex:1;min-height:360px;background:#ecebe8}
.map-status{display:none;padding:12px 14px;background:var(--warning);border-bottom:1px solid #e8d99b;font-size:.86rem}
.map-status.show{display:block}
.leaflet-popup-content-wrapper{border-radius:8px}
.leaflet-control-attribution{font-size:10px}
.pin{
  width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;border:3px solid #fff;box-shadow:0 2px 7px #0004
}
.pin.start{background:var(--green)}.pin.end{background:var(--accent)}.pin.all{background:#56534e}

@media(max-width:1000px){
  .app{grid-template-columns:1fr}
  .notes-pane{border-right:0;padding:24px 20px 36px}
  .map-pane{position:static;height:auto;padding:0 20px 24px}
  .map-card{height:auto}
  #map{height:520px;flex:none}
}
@media(max-width:600px){
  .topbar{position:static}
  .page-title{font-size:2rem}.cover{height:90px}
  .properties{grid-template-columns:88px 1fr}
  .notes-pane{padding:18px 14px 26px}
  .map-pane{padding:0 10px max(18px,env(safe-area-inset-bottom))}
  .map-toolbar{align-items:flex-start;flex-direction:column}
  .map-card{overflow:visible}
  #map{height:32vh;min-height:220px;max-height:280px}
  .actions{display:grid;grid-template-columns:1fr 1fr}
  .actions a{justify-content:center;text-align:center}
}
@media(max-width:390px){
  .actions{grid-template-columns:1fr}
  #map{height:30vh;min-height:210px;max-height:250px}
}

@media(max-width:600px){
  .timeline:before{left:68px}
  .stop{grid-template-columns:56px minmax(0,1fr);gap:25px}
  .dot{left:63px}
  .time{font-size:.76rem}
}

.download-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.download-actions a,.download-actions button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:7px;padding:8px 11px;text-decoration:none;cursor:pointer;min-height:38px;display:inline-flex;align-items:center;justify-content:center}
.download-actions .primary{background:var(--ink);color:#fff;border-color:var(--ink)}
@media(max-width:600px){.topbar{align-items:flex-start;flex-direction:column}.download-actions{width:100%}.download-actions a,.download-actions button{flex:1}}


.map-interaction-wrap{position:relative;flex:1;min-height:0}
.map-lock-overlay{
  position:absolute;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.12);backdrop-filter:blur(1px);
  cursor:pointer;touch-action:pan-y
}
.map-lock-overlay.hidden{display:none}
.map-lock-message{
  background:rgba(55,53,47,.9);color:#fff;border-radius:999px;
  padding:10px 14px;font-size:.88rem;box-shadow:0 3px 12px #0003
}
@media(max-width:600px){
  .map-interaction-wrap{height:32vh;min-height:220px;max-height:280px;flex:none}
  .map-interaction-wrap #map{height:100%;min-height:0;max-height:none}
}
@media(max-width:390px){
  .map-interaction-wrap{height:30vh;min-height:210px;max-height:250px}
}


/* V3.0 Map Card：地圖置中約 70%，左右留白 */
.map-preview-shell{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px 0 22px;
  background:var(--paper);
}
.map-interaction-wrap{
  width:70%;
  max-width:680px;
  min-width:0;
  border-radius:16px;
  overflow:hidden;
  border:1px solid var(--line);
  background:#ecebe8;
  position:relative;
  flex:none;
}
.map-interaction-wrap #map{
  width:100%;
  height:100%;
}
.map-card-caption{
  text-align:center;
  color:var(--muted);
  font-size:.82rem;
  padding:0 14px 14px;
}
@media(max-width:1000px){
  .map-preview-shell{padding:16px 0 20px}
  .map-interaction-wrap{width:76%;max-width:620px}
}
@media(max-width:600px){
  .map-preview-shell{padding:14px 0 18px}
  .map-interaction-wrap{
    width:70%;
    height:32vh;
    min-height:220px;
    max-height:280px;
    border-radius:14px;
  }
}
@media(max-width:390px){
  .map-interaction-wrap{
    width:72%;
    height:30vh;
    min-height:210px;
    max-height:250px;
  }
}

</style>
</head>
<body>
<header class="topbar">
  <div>
    <div class="brand">Osaka 2026</div>
    <div class="top-meta" id="countdown"></div>
  </div>
  <div class="download-actions" aria-label="下載行程檔案">
    <button type="button" id="downloadHtml">下載此 HTML</button>
    <button type="button" class="primary" id="downloadPdf">下載 PDF</button>
  </div>
</header>

<main class="app">
<section class="notes-pane">
  <div class="cover">🗾</div>
  <div class="eyebrow">TRAVEL NOTE</div>
  <h1 class="page-title">大阪五日旅行</h1>
  <p class="subtitle">Notion 式行程筆記＋點擊連動地圖</p>
  <div class="properties">
    <div class="prop-name">日期</div><div>2026/7/31–8/4</div>
    <div class="prop-name">住宿</div><div>本町・環球城・梅田</div>
    <div class="prop-name">交通</div><div>KIX、大阪市區、奈良</div>
  </div>
  <div class="day-tabs" id="dayTabs"></div>
  <div class="day-header"><h2 id="dayTitle"></h2><p id="dayTheme"></p></div>
  <div class="timeline" id="timeline"></div>
  <div class="callout" id="notes"></div>
</section>

<aside class="map-pane">
  <div class="map-card">
    <div class="map-toolbar">
      <strong>Map</strong>
      <div class="view-buttons">
        <button type="button" id="showSegment" class="active">目前路段</button>
        <button type="button" id="showDay">全日</button>
        <span class="view-state" id="viewState"></span>
      </div>
    </div>

    <div class="map-info-top">
      <div class="map-status" id="mapStatus">
        線上街道圖目前無法載入；上方 Google Maps 按鈕仍可正常使用。請以 Safari 或 Chrome 開啟此檔案。
      </div>
      <div class="segment" id="segmentInfo"></div>
      <div class="actions">
        <a class="primary" id="openRoute" target="_blank" rel="noopener noreferrer">Google Maps 導航</a>
        <a id="openPlace" target="_blank" rel="noopener noreferrer">查看目的地</a>
      </div>
    </div>

    <div class="map-preview-shell">
      <div class="map-interaction-wrap" id="mapInteractionWrap">
        <div id="map" aria-label="大阪行程地圖"></div>
        <button type="button" class="map-lock-overlay" id="mapLockOverlay" aria-label="啟用地圖操作">
          <span class="map-lock-message">點一下即可操作地圖</span>
        </button>
      </div>
    </div>
    <div class="map-card-caption">Route Preview｜點一下地圖後可拖曳與縮放</div>
  </div>
</aside>
</main>

<script>
const days=[
{"date":"7/31","weekday":"五","title":"抵達大阪・心齋橋・道頓堀","theme":"抵達日｜南區散步與關西風壽喜燒","items":[
["12:10","✈️","關西國際機場 KIX","抵達日本、辦理入境與領取行李","Kansai International Airport","transport","KIX"],
["14:30","🏨","Osaka View Hotel Honmachi","寄放行李／入住","Osaka View Hotel Honmachi","hotel","HONMACHI"],
["15:30","🛍️","心齋橋筋商店街","散步與購物","Shinsaibashi-Suji Shopping Street","shopping","SHINSAIBASHI"],
["17:00","📍","道頓堀","河畔散步、拍照","Dotonbori Osaka","spot","DOTONBORI"],
["18:30","🍲","本せきぐち Hon Sekiguchi","關西風壽喜燒晚餐；建議提前預約","本せきぐち 大阪 千日前","food","SEKIGUCHI"],
["20:30","🏨","Osaka View Hotel Honmachi","返回飯店休息","Osaka View Hotel Honmachi","hotel","HONMACHI"]],
"notes":["抵達時間可能受入境與行李影響，下午行程保留彈性。","本せきぐち位於千日前，晚餐後可再散步道頓堀。"]},

{"date":"8/1","weekday":"六","title":"奈良一日遊・難波晚餐","theme":"奈良公園｜午餐待決定｜長腳蟹料理","items":[
["10:00","🏨","Osaka View Hotel Honmachi","飯店出發","Osaka View Hotel Honmachi","hotel","HONMACHI"],
["11:10","🚆","近鐵奈良站","抵達奈良","Kintetsu Nara Station","transport","KINTETSU_NARA"],
["11:30","🦌","奈良公園","散步、餵鹿","Nara Park","spot","NARA_PARK"],
["13:00","🍱","奈良午餐（待決定）","可選釜飯、茶粥、柿葉壽司或奈良和牛","奈良公園 ランチ","food","NARA_LUNCH"],
["16:45","⛩️","難波八阪神社","返回大阪後參拜","Namba Yasaka Shrine","spot","YASAKA"],
["18:30","🦀","大阪かに源 道頓堀店","長腳蟹料理晚餐；建議預約","大阪かに源 道頓堀店","food","KANIGEN"],
["20:30","🏨","Osaka View Hotel Honmachi","返回飯店","Osaka View Hotel Honmachi","hotel","HONMACHI"]],
"notes":["奈良午餐尚未決定，保留為可替換項目。","奈良回大阪後若太累，可視情況取消八阪神社。"]},

{"date":"8/2","weekday":"日","title":"日本環球影城 USJ","theme":"全天樂園日｜提早出發","items":[
["06:45","🏨","Osaka View Hotel Honmachi","退房並提早出發","Osaka View Hotel Honmachi","hotel","HONMACHI"],
["07:35","🎢","日本環球影城 USJ","排隊入園、全天遊玩","Universal Studios Japan","spot","USJ"],
["閉園後","🏨","Oriental Hotel Universal City","步行入住飯店","Oriental Hotel Universal City","hotel","ORIENTAL"]],
"notes":["實際出發時間需依 2026/8/2 官方開園時間再調整。","Express Pass、整理券與園區餐廳之後可補入。"]},

{"date":"8/3","weekday":"一","title":"大阪城・梅田購物・敘敘苑","theme":"行李轉移｜大阪城｜梅田集中逛街","items":[
["09:00","🏨","Oriental Hotel Universal City","退房","Oriental Hotel Universal City","hotel","ORIENTAL"],
["10:00","🧳","Canopy by Hilton Osaka Umeda","寄放行李","Canopy by Hilton Osaka Umeda","hotel","CANOPY"],
["10:45","🏯","大阪城","城郭與公園散策","Osaka Castle","spot","OSAKA_CASTLE"],
["13:30","🌿","Grand Green Osaka","午餐、散步與新商場","Grand Green Osaka","spot","GRAND_GREEN"],
["15:00","🛍️","LUCUA Osaka","購物","LUCUA Osaka","shopping","LUCUA"],
["16:30","🛍️","阪急百貨店 梅田本店","百貨採買","Hankyu Umeda Main Store","shopping","HANKYU"],
["18:30","🥩","敘敘苑 LUCUA大阪店","最後一晚燒肉晚餐；建議預約","叙々苑 ルクア大阪店","food","JOJOEN"],
["20:30","🏨","Canopy by Hilton Osaka Umeda","入住飯店","Canopy by Hilton Osaka Umeda","hotel","CANOPY"]],
"notes":["梅田區域以步行為主，商場順序可依當日購物狀況調整。","敘敘苑位於 LUCUA 10F。"]},

{"date":"8/4","weekday":"二","title":"早餐・前往機場","theme":"返程日｜提早前往 KIX","items":[
["08:00","☕","Canopy by Hilton Osaka Umeda","早餐","Canopy by Hilton Osaka Umeda","food","CANOPY"],
["09:00","🏨","Canopy by Hilton Osaka Umeda","退房","Canopy by Hilton Osaka Umeda","hotel","CANOPY"],
["09:20","🚆","前往關西國際機場","搭車前往 KIX","Kansai International Airport","transport","KIX"],
["10:50","✈️","關西國際機場 KIX","辦理登機、安檢與出境","Kansai International Airport","transport","KIX"],
["13:10","🛫","班機離開日本","旅程結束","Kansai International Airport","transport","KIX"]],
"notes":["國際線建議至少提前約 2 小時抵達；請依航空公司通知為準。"]}
];

const P={
"KIX":[34.4347,135.244],"HONMACHI":[34.6836,135.4994],"SHINSAIBASHI":[34.6733,135.5013],
"DOTONBORI":[34.6687,135.5019],"SEKIGUCHI":[34.6668,135.5067],"KINTETSU_NARA":[34.6844,135.8279],
"NARA_PARK":[34.6851,135.843],"NARA_LUNCH":[34.6838,135.8384],"YASAKA":[34.6592,135.4962],
"KANIGEN":[34.6692,135.5039],"USJ":[34.6654,135.4323],"ORIENTAL":[34.6678,135.4372],
"CANOPY":[34.7056,135.4906],"OSAKA_CASTLE":[34.6873,135.5262],"GRAND_GREEN":[34.7053,135.493],
"LUCUA":[34.7025,135.4951],"HANKYU":[34.7037,135.4987],"JOJOEN":[34.7026,135.4952]
};

let activeDay=0,activeStep=0,mode='segment',map=null,markers=[],lines=[];

let mapInteractionEnabled=false;
function setMapInteraction(enabled){
  mapInteractionEnabled=enabled;
  const overlay=$('mapLockOverlay');
  if(overlay) overlay.classList.toggle('hidden',enabled);
  if(!map)return;
  const method=enabled?'enable':'disable';
  if(map.dragging&&map.dragging[method]) map.dragging[method]();
  if(map.touchZoom&&map.touchZoom[method]) map.touchZoom[method]();
  if(map.doubleClickZoom&&map.doubleClickZoom[method]) map.doubleClickZoom[method]();
  if(map.scrollWheelZoom) map.scrollWheelZoom.disable();
  if(map.boxZoom&&map.boxZoom[method]) map.boxZoom[method]();
  if(map.keyboard&&map.keyboard[method]) map.keyboard[method]();
}
function lockMapInteraction(){setMapInteraction(false)}
function unlockMapInteraction(){setMapInteraction(true)}

const $=id=>document.getElementById(id);
const coord=key=>P[key];
const gSearch=q=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);
const gRoute=(a,b,travelMode='transit')=>'https://www.google.com/maps/dir/?api=1&origin='+
  encodeURIComponent(a)+'&destination='+encodeURIComponent(b)+'&travelmode='+travelMode;

function km(a,b){
  const R=6371,dLat=(b[0]-a[0])*Math.PI/180,dLon=(b[1]-a[1])*Math.PI/180;
  const x=Math.sin(dLat/2)**2+Math.cos(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.sin(dLon/2)**2;
  return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}
function previousDistinct(items,index){
  const current=coord(items[index][6]);
  for(let i=index-1;i>=0;i--){
    const p=coord(items[i][6]);
    if(km(p,current)>.03)return {index:i,item:items[i],coord:p};
  }
  return null;
}
function pin(label,type){
  return L.divIcon({
    className:'',
    html:`<div class="pin ${type}">${label}</div>`,
    iconSize:[30,30],iconAnchor:[15,15],popupAnchor:[0,-18]
  });
}
function showMapError(){
  $('mapStatus').classList.add('show');
}
function initMap(){
  if(!window.L){showMapError();return}
  try{
    map=L.map('map',{zoomControl:true,preferCanvas:true}).setView([34.681,135.501],12);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
      maxZoom:19,
      attribution:'&copy; OpenStreetMap contributors',
      crossOrigin:true
    }).addTo(map);
    map.whenReady(()=>{
      renderMap();
      setMapInteraction(window.innerWidth>1000);
      setTimeout(()=>map.invalidateSize(),150);
    });
    map.on('tileerror',showMapError);
    window.addEventListener('resize',()=>setTimeout(()=>map.invalidateSize(),120));
    window.addEventListener('orientationchange',()=>setTimeout(()=>map.invalidateSize(),350));
  }catch(e){showMapError()}
}
function clearMap(){
  markers.forEach(x=>map.removeLayer(x)); markers=[];
  lines.forEach(x=>map.removeLayer(x)); lines=[];
}
function fit(coords,maxZoom){
  if(coords.length===1){map.setView(coords[0],maxZoom);return}
  map.fitBounds(L.latLngBounds(coords),{padding:[45,45],maxZoom});
}
function renderMap(){
  if(!map)return;
  clearMap();
  const items=days[activeDay].items;
  if(mode==='day'){
    const coords=items.map(it=>coord(it[6]));
    const unique=coords.filter((c,i)=>i===0||km(coords[i-1],c)>.03);
    if(unique.length>1){
      lines.push(L.polyline(unique,{color:'#b66b55',weight:4,opacity:.9,dashArray:'7 7'}).addTo(map));
    }
    items.forEach((it,i)=>{
      const m=L.marker(coords[i],{icon:pin(i+1,'all')})
        .bindPopup(`<strong>${it[2]}</strong><br>${it[0]}`).addTo(map);
      markers.push(m);
    });
    fit(coords,14);$('viewState').textContent='全日';
  }else{
    const current=coord(items[activeStep][6]);
    const prev=previousDistinct(items,activeStep);
    if(prev){
      lines.push(L.polyline([prev.coord,current],{color:'#d45d3c',weight:6,opacity:.9,dashArray:'8 6'}).addTo(map));
      markers.push(L.marker(prev.coord,{icon:pin('起','start')}).bindPopup(`<strong>起點</strong><br>${prev.item[2]}`).addTo(map));
      markers.push(L.marker(current,{icon:pin('終','end')}).bindPopup(`<strong>目的地</strong><br>${items[activeStep][2]}`).addTo(map));
      const d=km(prev.coord,current);
      fit([prev.coord,current],d<1?17:d<5?15:12);
      $('viewState').textContent=d<1?'街區放大':d<8?'市區路段':'跨城市路段';
    }else{
      markers.push(L.marker(current,{icon:pin('1','end')}).addTo(map));
      map.setView(current,16);$('viewState').textContent='第一站';
    }
  }
  setTimeout(()=>map.invalidateSize(),80);
}
function updateInfo(){
  const items=days[activeDay].items,it=items[activeStep],prev=previousDistinct(items,activeStep);
  $('openPlace').href=gSearch(it[4]);
  if(prev){
    const walk=km(prev.coord,coord(it[6]))<1.6&&prev.item[5]!=='transport'&&it[5]!=='transport';
    $('segmentInfo').innerHTML=`<strong>${prev.item[2]} → ${it[2]}</strong><span>起點：${prev.item[2]}／目的地：${it[2]}</span>`;
    $('openRoute').href=gRoute(prev.item[4],it[4],walk?'walking':'transit');
    $('openRoute').textContent=`導航到 ${it[2]}`;
  }else{
    $('segmentInfo').innerHTML=`<strong>${it[2]}</strong><span>本日第一站，沒有前一個不同地點。</span>`;
    $('openRoute').href=gSearch(it[4]);$('openRoute').textContent='查看第一站';
  }
}
function selectStep(i){
  activeStep=i;mode='segment';
  $('showSegment').classList.add('active');$('showDay').classList.remove('active');
  document.querySelectorAll('.stop').forEach((el,n)=>el.classList.toggle('active',n===i));
  updateInfo();renderMap();
  if(window.innerWidth<=1000){
    document.querySelector('.map-pane').scrollIntoView({behavior:'smooth',block:'start'});
  }
}
function renderTimeline(){
  const items=days[activeDay].items;
  $('timeline').innerHTML=items.map((it,i)=>{
    const prev=previousDistinct(items,i);
    const route=prev?`${prev.item[2]} → ${it[2]}`:'本日第一站';
    return `<article class="stop" data-step="${i}">
      <span class="dot"></span><div class="time">${it[0]}</div>
      <div class="block"><h3>${it[1]} ${it[2]}</h3><p>${it[3]}</p>
      <span class="route-chip">${route}</span></div></article>`;
  }).join('');
  document.querySelectorAll('.stop').forEach(el=>el.addEventListener('click',()=>selectStep(+el.dataset.step)));
}
function renderDay(){
  const d=days[activeDay];activeStep=0;mode='segment';
  document.querySelectorAll('[data-day]').forEach((b,i)=>b.classList.toggle('active',i===activeDay));
  $('dayTitle').textContent=`${d.date}（${d.weekday}） ${d.title}`;
  $('dayTheme').textContent=d.theme;
  $('notes').innerHTML='<strong>今日提醒</strong><ul>'+d.notes.map(x=>`<li>${x}</li>`).join('')+'</ul>';
  renderTimeline();
  const first=document.querySelector('.stop');if(first)first.classList.add('active');
  updateInfo();renderMap();
}
$('dayTabs').innerHTML=days.map((d,i)=>`<button type="button" data-day="${i}">${d.date}</button>`).join('');
document.querySelectorAll('[data-day]').forEach(b=>b.addEventListener('click',()=>{activeDay=+b.dataset.day;renderDay()}));
$('showSegment').addEventListener('click',()=>{mode='segment';$('showSegment').classList.add('active');$('showDay').classList.remove('active');renderMap()});
$('showDay').addEventListener('click',()=>{mode='day';$('showDay').classList.add('active');$('showSegment').classList.remove('active');renderMap()});

const overlayEl=$('mapLockOverlay');
if(overlayEl){
  overlayEl.addEventListener('click',unlockMapInteraction);
  overlayEl.addEventListener('touchend',(e)=>{e.preventDefault();unlockMapInteraction()},{passive:false});
}
document.addEventListener('click',(e)=>{
  if(window.innerWidth<=1000 && mapInteractionEnabled){
    const wrap=$('mapInteractionWrap');
    if(wrap && !wrap.contains(e.target)) lockMapInteraction();
  }
});
if('IntersectionObserver' in window){
  const wrap=$('mapInteractionWrap');
  if(wrap){
    const observer=new IntersectionObserver(entries=>{
      entries.forEach(entry=>{
        if(window.innerWidth<=1000 && !entry.isIntersecting) lockMapInteraction();
      });
    },{threshold:0.15});
    observer.observe(wrap);
  }
}

if(downloadPdfButton){downloadPdfButton.addEventListener('click',()=>{const bytes=Uint8Array.from(atob(embeddedPdfBase64),c=>c.charCodeAt(0));const blob=new Blob([bytes],{type:'application/pdf'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='Osaka2026_V3_0_Itinerary.pdf';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);});}
const downloadHtmlButton=document.getElementById('downloadHtml');
if(downloadHtmlButton){
  downloadHtmlButton.addEventListener('click',()=>{
    const source='<!doctype html>\n'+document.documentElement.outerHTML;
    const blob=new Blob([source],{type:'text/html;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download='Osaka2026_V3_0_Downloads.html';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  });
